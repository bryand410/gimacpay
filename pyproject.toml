[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gimacpay"
version = "0.1.0"
description = "Client Python pour GIMACPAY, le réseau de paiement interbancaire de la CEMAC. Zéro dépendance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ulrich Bryand Tamouffe Teyo" }]
keywords = [
    "gimacpay",
    "gimac",
    "cemac",
    "mobile-money",
    "payments",
    "fintech",
    "africa",
    "cameroun",
    "xaf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Zero runtime dependencies. This is a deliberate engineering decision, not an
# accident: see SECURITY.md. A payments client that pulls a dependency tree is
# a supply-chain liability for the exact audience that would use it.
dependencies = []

[project.optional-dependencies]
# ruff is pinned to a minor series on purpose: `ruff format --check` is a CI gate,
# and an unpinned formatter turns that gate into a coin flip whenever a new
# release changes the style. pytest is free to float.
dev = ["pytest>=7.4", "ruff~=0.17.0"]

[project.urls]
Homepage = "https://github.com/bryand410/gimacpay"
Issues = "https://github.com/bryand410/gimacpay/issues"
Changelog = "https://github.com/bryand410/gimacpay/blob/main/CHANGELOG.md"

[project.scripts]
gimacpay = "gimacpay.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gimacpay"]

[tool.hatch.build.targets.sdist]
# docs/reference holds GIMAC's specification. It is included in the source
# repository as a development reference and deliberately excluded from every
# published artifact: it is not ours to redistribute.
exclude = ["docs/reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
